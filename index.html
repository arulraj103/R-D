/* ── Site Hero ──────────────────────────────────────────────── */
.site-hero {
  position: relative;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  padding: 52px 0 44px;
}

.site-hero__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.045;
  pointer-events: none;
}

.site-hero__inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
  animation: heroFadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes heroFadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .site-hero__inner { animation: none; }
}

.site-hero__institution {
  font-size: clamp(17px, 3.5vw, 26px);
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1.25;
  margin: 0;
}

.site-hero__dept {
  font-size: clamp(13px, 2.2vw, 17px);
  font-weight: 500;
  color: var(--muted);
  margin: 7px 0 0;
  letter-spacing: 0.01em;
}

.site-hero__divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
  width: min(340px, 80%);
}

.site-hero__divider-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

.site-hero__divider-diamond {
  width: 7px;
  height: 7px;
  background: var(--blue);
  transform: rotate(45deg);
  flex-shrink: 0;
  border-radius: 1px;
}

.site-hero__cell-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--blue);
  color: #fff;
  border-radius: 4px;
  padding: 8px 20px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.025em;
}

.site-hero__cell-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.55);
}

@media (max-width: 650px) {
  .site-hero { padding: 36px 0 30px; }
  .site-hero__divider { margin: 16px 0; }
}

const ACADEMIC_YEARS = Object.freeze({
  '2022-2023': { start: '2022-06-01', end: '2023-05-31' },
  '2023-2024': { start: '2023-06-01', end: '2024-05-31' },
  '2024-2025': { start: '2024-06-01', end: '2025-05-31' },
  '2025-2026': { start: '2025-06-01', end: '2026-05-31' },
})

const academicYearList = Object.keys(ACADEMIC_YEARS)

function isAcademicYear(value) {
  return Object.hasOwn(ACADEMIC_YEARS, value)
}

function rangeForAcademicYear(value) {
  return ACADEMIC_YEARS[value] || null
}

function isDateInAcademicYear(value, academicYear) {
  const range = rangeForAcademicYear(academicYear)
  return Boolean(range && /^\d{4}-\d{2}-\d{2}$/.test(value || '') && value >= range.start && value <= range.end)
}

function applyAcademicYearDateRange(root, academicYear) {
  const range = rangeForAcademicYear(academicYear)
  if (!range) return
  root.querySelectorAll('input[type="date"]').forEach((input) => {
    input.min = range.start
    input.max = range.end
  })
}

function escapeHtml(value = '') { return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]) }
function go(path) { const hash = path.startsWith('#') ? path : `#${path.startsWith('/') ? path : '/' + path}`; if (location.hash === hash) render(); else location.hash = hash }
function back(path) { return `<button class="btn btn-outline" data-go="${path}">← Back</button>` }
function header(isAdmin = false) { return `<header class="header"><div class="container header-inner"><a href="#/academic-years" data-go="/academic-years" class="header-brand"><i></i>Academic Research Records</a><nav>${isAdmin ? '<a href="#/admin/dashboard" data-go="/admin/dashboard">Dashboard</a><button class="btn btn-outline btn-sm" data-action="logout">Sign out</button>' : '<a href="#/admin/login" data-go="/admin/login">Admin</a>'}</nav></div></header>` }
function shell(content, isAdmin = false) { return `<div class="page">${header(isAdmin)}${content}</div>` }

function fieldMarkup(field, value) {
  const [name, label, type, required, options, attrs = {}] = field
  const requiredMark = required ? ' <b class="req">*</b>' : ''
  if (type === 'authors') return `<div class="field full"><label>${label}${requiredMark}</label><div id="authors-list"></div><p class="field-error" data-error="authors"></p><button type="button" class="add-author-btn" data-action="add-author">+ Add Author</button></div>`
  const attributes = Object.entries(attrs).map(([key, attributeValue]) => `${key}="${attributeValue}"`).join(' ')
  if (type === 'select') { const selectedValue = name === 'scopus_indexed' && typeof value === 'boolean' ? (value ? 'Yes' : 'No') : (value || options[0]); return `<div class="field"><label for="${name}">${label}${requiredMark}</label><select id="${name}" name="${name}" ${required ? 'required' : ''}>${options.map((option) => `<option value="${escapeHtml(option)}" ${String(selectedValue) === option ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}</select><p class="field-error" data-error="${name}"></p></div>` }
  return `<div class="field"><label for="${name}">${label}${requiredMark}</label><input id="${name}" name="${name}" type="${type}" value="${escapeHtml(value ?? '')}" ${required ? 'required' : ''} ${attributes}><p class="field-error" data-error="${name}"></p></div>`
}

function renderAuthors(values = ['']) {
  const list = document.querySelector('#authors-list')
  if (!list) return
  list.innerHTML = values.map((value, index) => `<div class="author-row"><input type="text" name="authors" value="${escapeHtml(value)}" placeholder="Author ${index + 1}" required>${values.length > 1 ? `<button type="button" class="remove-btn" data-action="remove-author" data-index="${index}" aria-label="Remove author">×</button>` : ''}</div>`).join('')

function clearErrors(form) { form.querySelectorAll('.field-error').forEach((node) => { node.textContent = '' }); form.querySelectorAll('.error').forEach((node) => node.classList.remove('error')) }
function setFieldError(form, name, message) { form.querySelector(`[data-error="${name}"]`)?.append(message); form.elements[name]?.classList.add('error') }
function formDataFor(schema, form) {
  const data = { academic_year: form.elements.academic_year.value }
  schema.fields.forEach(([name, , type]) => {
    if (type === 'authors') data.authors = [...form.querySelectorAll('input[name="authors"]')].map((input) => input.value.trim()).filter(Boolean)
    else { const rawValue = form.elements[name].value.trim(); data[name] = type === 'date' && rawValue === '' ? null : rawValue }
  })
  if (data.scopus_indexed) data.scopus_indexed = data.scopus_indexed === 'Yes'
  ;['amount', 'impact_factor', 'number_of_days', 'number_of_participants'].forEach((key) => { if (data[key] !== undefined && data[key] !== '') data[key] = Number(data[key]); else if (data[key] === '') data[key] = null })
  return data
}
function validateRecord(schema, data, form) {
  let valid = true; clearErrors(form)
  schema.fields.forEach(([name, label, type, required]) => {
    const value = data[name]
    if (required && (value === '' || value === null || (Array.isArray(value) && !value.length))) { setFieldError(form, name, `${label} is required.`); valid = false }
    if (type === 'date' && value && !isDateInAcademicYear(value, data.academic_year)) { setFieldError(form, name, `Date must be between ${rangeForAcademicYear(data.academic_year).start} and ${rangeForAcademicYear(data.academic_year).end}.`); valid = false }
    if (type === 'number' && value !== null && (!Number.isFinite(value) || value < 0)) { setFieldError(form, name, `${label} must be a non-negative number.`); valid = false }
  })
  if (data.status === 'Completed' && !data.complete_date) { setFieldError(form, 'complete_date', 'Complete Date is required for completed projects.'); valid = false }
  if (data.doi && !/^https?:\/\/.+/.test(data.doi)) { setFieldError(form, 'doi', 'DOI must be a valid URL beginning with http:// or https://.'); valid = false }
  if (data.doi === '') data.doi = null
  return valid
}
async function saveForm(event, year, slug, recordId, onSaved) {
  event.preventDefault()
  const form = event.currentTarget; const schema = schemas[slug]; const data = formDataFor(schema, form)
  if (!validateRecord(schema, data, form)) { showFormMessage('error', 'Please correct the highlighted fields.'); return }
  const submit = form.querySelector('[type="submit"]'); submit.disabled = true; submit.innerHTML = '<span class="spinner"></span> Saving…'; showFormMessage('', '')
  const request = recordId ? supabaseClient.from(schema.table).update(data).eq('id', recordId).eq('academic_year', year) : supabaseClient.from(schema.table).insert(data)
  const { error } = await request
  if (error) { showFormMessage('error', error.message || 'The record could not be saved.'); submit.disabled = false; submit.textContent = recordId ? 'Save changes' : 'Save record'; return }
  if (onSaved) { onSaved(); return }
  showSuccessPage(year, slug)
}

function rowTitle(record, slug) { return record.title || record.paper_title || record.project_title || `${record.client_industry || ''} ${record.faculty_name || ''}`.trim() || 'Record' }

/* ─── Excel download helpers ─────────────────────────────── */
function sanitiseRows(rows) {
  return rows.map((row) => {
    const out = {}
    Object.entries(row).forEach(([k, v]) => {
      if (['id', 'created_at', 'updated_at'].includes(k)) return
      out[titleCase(k)] = Array.isArray(v) ? v.join(', ') : (v ?? '')
    })
    return out
  })
}

function downloadXlsx(rows, sheetName, filename) {
  if (!rows || rows.length === 0) { alert('No records found for the selected filter.'); return }
  const wb = XLSX.utils.book_new()
  const ws = XLSX.utils.json_to_sheet(sanitiseRows(rows))
  /* auto column widths */
  const keys = Object.keys(sanitiseRows([rows[0]])[0])
  ws['!cols'] = keys.map((k) => ({ wch: Math.min(50, Math.max(k.length + 2, 14)) }))
  XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31))
  XLSX.writeFile(wb, filename)
}

async function fetchAllForSlug(slug, year) {
  if (slug === 'fdp-training') {
    const [c, a] = await Promise.all(['conducted', 'attended'].map(async (kind) => {
      const { data } = await supabaseClient.from(schemas[kind].table).select('*').eq('academic_year', year).order('created_at', { ascending: false })
      return (data || []).map((r) => ({ ...r, _kind: kind }))
    }))
    return [...c, ...a]
  }
  const schema = schemas[slug]
  if (!schema) return []
  const { data } = await supabaseClient.from(schema.table).select('*').eq('academic_year', year).order('created_at', { ascending: false })
  return data || []
}

function categoryLabel(slug) {
  return (categoryBySlug[slug] || {}).short || slug
}

/* Download a single row immediately */
function downloadSingleRecord(record, slug, year) {
  const label = categoryLabel(slug)
  const safe = (rowTitle(record, slug) || 'record').replace(/[^a-z0-9]/gi, '_').slice(0, 40)
  downloadXlsx([record], label, `${year}_${label}_${safe}.xlsx`)
}

/* Download all records for a year + category */
async function downloadCategoryYear(slug, year, btnEl) {
  btnEl.disabled = true
  const orig = btnEl.textContent
  btnEl.innerHTML = '<span class="spinner"></span> Downloading…'
  try {
    const rows = await fetchAllForSlug(slug, year)
    const label = categoryLabel(slug)
    downloadXlsx(rows, label, `${year}_${label}.xlsx`)
  } finally {
    btnEl.disabled = false
    btnEl.textContent = orig
  }
}

/* Download all records for an entire academic year (all categories, multi-sheet) */
async function downloadFullYear(year, btnEl) {
  btnEl.disabled = true
  const orig = btnEl.textContent
  btnEl.innerHTML = '<span class="spinner"></span> Downloading…'
  try {
    const wb = XLSX.utils.book_new()
    let anyData = false
    for (const cat of categories) {
      const rows = await fetchAllForSlug(cat.slug, year)
      if (rows.length === 0) continue
      anyData = true
      const ws = XLSX.utils.json_to_sheet(sanitiseRows(rows))
      const keys = Object.keys(sanitiseRows([rows[0]])[0])
      ws['!cols'] = keys.map((k) => ({ wch: Math.min(50, Math.max(k.length + 2, 14)) }))
      XLSX.utils.book_append_sheet(wb, ws, cat.short.slice(0, 31))
    }
    if (!anyData) { alert('No records found for ' + year + '.'); return }
    XLSX.writeFile(wb, `${year}_All_Records.xlsx`)
  } finally {
    btnEl.disabled = false
    btnEl.textContent = orig
  }
}

function renderRecords(year, slug, rows) {

  function paint() {

emic year.</div>'}<div class="pagination"><button class="btn btn-outline btn-sm" data-action="previous" ${state.page === 1 ? 'disabled' : ''}>Previous</button><span>Page ${state.page} of ${pages}</span><button class="btn btn-outline btn-sm" data-action="next" ${state.page === pages ? 'disabled' : ''}>Next</button></div></section></main>`, true)

    /* download-all (filtered set) */
    const dlAllBtn = document.querySelector('#dl-all-btn')
    if (dlAllBtn) { dlAllBtn.onclick = function() { const label = categoryLabel(slug); downloadXlsx(filtered, label, `${year}_${label}_filtered.xlsx`) } }
  }
  paint()
}
function viewRecord(record) { const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.innerHTML = `<section class="modal"><div class="action-heading"><h2>Record details</h2><button class="btn btn-outline btn-sm" data-action="close">Close</button></div><dl class="record-details">${Object.entries(record).filter(([key]) => !['id', 'created_at', 'updated_at'].includes(key)).map(([key, value]) => `<div><dt>${titleCase(key)}</dt><dd>${escapeHtml(Array.isArray(value) ? value.join(', ') : value ?? '—')}</dd></div>`).join('')}</dl></section>`; document.body.append(modal); modal.addEventListener('click', (event) => { if (event.target === modal || event.target.dataset.action === 'close') modal.remove() }) }
function openAdminEdit(year, slug, record) { const kind = record._kind || slug; const schema = schemas[kind]; if (!schema) return; const previous = app.innerHTML; formPage(year, kind, record, () => { render(); }); document.querySelector('.header').insertAdjacentHTML('afterend', '<div class="admin-edit-note">Editing in admin mode. Saving keeps the current academic-year filter.</div>') }
async function deleteRecord(year, slug, record) { if (!confirm(`Delete “${rowTitle(record, slug)}”? This cannot be undone.`)) return; const kind = record._kind || slug; const { error } = await supabaseClient.from(schemas[kind].table).delete().eq('id', record.id).eq('academic_year', year); if (error) { alert(error.message); return } render() }

async function logout() { await supabaseClient.auth.signOut(); go('/admin/login') }
async function render() {
  const route = (location.hash || '#/academic-years').replace(/^#/, '')
  const parts = route.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean)
  if (!parts.length || (parts[0] === 'register')) return go('/academic-years')
  if (parts[0] === 'academic-years') return yearSelection()
  if (parts[0] === 'academic-year') { if (parts.length === 2) return categoryPage(parts[1]); if (parts[2] === 'fdp-training' && parts.length === 3) return fdpChoice(parts[1]); return formPage(parts[1], parts[3] || parts[2]) }
  if (parts[0] === 'admin' && parts[1] === 'login') return loginPage()
  if (parts[0] === 'admin' && parts[1] === 'dashboard') return requireAdmin(adminDashboard)
  if (parts[0] === 'admin' && parts.length === 2) return requireAdmin(() => adminYearCategories(parts[1]))
  if (parts[0] === 'admin' && parts.length === 3) return requireAdmin(() => adminRecords(parts[1], parts[2]))
  go('/academic-years')
}

document.addEventListener('click', (event) => { const target = event.target.closest('[data-go]'); if (target) { event.preventDefault(); go(target.dataset.go) } if (event.target.dataset.action === 'logout') logout(); if (event.target.dataset.action === 'add-author') { const values = [...document.querySelectorAll('input[name="authors"]')].map((input) => input.value); if (values.length < 4) renderAuthors([...values, '']) } if (event.target.dataset.action === 'remove-author') { const values = [...document.querySelectorAll('input[name="authors"]')].map((input) => input.value); values.splice(Number(event.target.dataset.index), 1); renderAuthors(values) } })
window.addEventListener('hashchange', render)
render()

  </script>
</body>
</html>
